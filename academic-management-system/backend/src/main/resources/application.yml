spring:
  application:
    name: bcafly-backend

  datasource:
    url: jdbc:postgresql://localhost:5432/bcafly_db
    username: bcafly_app
    password: bcafly_secret
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: 8080

app:
  jwt:
    secret: BcaFlySecretKey2026ChangeThisInProduction
    expiration-ms: 86400000  # 24 hours
  storage:
    upload-dir: ../storage/uploads
    report-dir: ../storage/reports
    export-dir: ../storage/exports
    backup-dir: ../storage/backups
