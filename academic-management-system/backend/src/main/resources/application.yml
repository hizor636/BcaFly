spring:
  application:
    name: bcafly-backend
  profiles:
    active: postgresql

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/bcafly_db}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:hizor}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  flyway:
    enabled: false

  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 25MB

server:
  port: 8080

app:
  jwt:
    secret: ${JWT_SECRET:BcaFlySecretKey2026ChangeThisInProductionRobustSecureKey32Bytes}
    expiration-ms: 86400000  # 24 hours
  storage:
    upload-dir: ../storage/uploads
    report-dir: ../storage/reports
    export-dir: ../storage/exports
    backup-dir: ../storage/backups
