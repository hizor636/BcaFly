version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: bcafly_postgres
    environment:
      POSTGRES_DB: bcafly_db
      POSTGRES_USER: bcafly_app
      POSTGRES_PASSWORD: bcafly_secret
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres_data:
